<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel Bar – Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#17120f;--card:#241c17;--text:#f4ead7;--muted:#b9a98f;--line:#3a2e26;--beer:#e8a33a;--cocktail:#f06b84;--on:#17120f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6efe1;--card:#fffaf0;--text:#241c17;--muted:#6f6050;--line:#e2d4bb;--beer:#b86f00;--cocktail:#c8304e;--on:#fffaf0}}
:root[data-theme="light"]{--bg:#f6efe1;--card:#fffaf0;--text:#241c17;--muted:#6f6050;--line:#e2d4bb;--beer:#b86f00;--cocktail:#c8304e;--on:#fffaf0}
:root[data-theme="dark"]{--bg:#17120f;--card:#241c17;--text:#f4ead7;--muted:#b9a98f;--line:#3a2e26;--beer:#e8a33a;--cocktail:#f06b84;--on:#17120f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 20px 48px}
h1,h2{font-family:"Bricolage Grotesque",Georgia,sans-serif;margin:0;line-height:1.05}
h1{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:800}
.top{display:flex;justify-content:flex-end;margin-bottom:18px}
.top select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font:inherit;font-size:.95rem;cursor:pointer}
.sub{color:var(--muted);margin:10px 0 28px}
.tile{display:block;width:100%;text-align:left;border:0;border-radius:22px;padding:26px 22px;margin-bottom:14px;cursor:pointer;color:var(--on);font:inherit}
.tile h2{font-size:2rem;font-weight:800}
.tile p{margin:6px 0 0;opacity:.85}
.t-beer{background:var(--beer)}.t-cocktail{background:var(--cocktail)}
.tile:focus-visible,.back:focus-visible,.item button:focus-visible,.top select:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.back{background:none;border:1px solid var(--line);color:var(--text);border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer;margin-bottom:22px}
.menu-head{border-left:8px solid var(--accent);padding-left:14px;margin-bottom:22px}
.menu-head h2{font-size:2.2rem;font-weight:800}
.menu-head p{margin:6px 0 0;color:var(--muted)}
.item{border-bottom:1px solid var(--line)}
.item button{display:flex;justify-content:space-between;gap:16px;align-items:baseline;width:100%;background:none;border:0;color:var(--text);text-align:left;padding:16px 0;font:inherit;cursor:pointer}
.name{display:block;font:800 1.25rem "Bricolage Grotesque",Georgia,sans-serif}
.meta{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.price{font-weight:600;color:var(--accent);white-space:nowrap}
.more{display:none;padding:0 0 16px;color:var(--muted)}
.item.open .more{display:block}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<main>
<div class="top"><select id="lang" aria-label="Language / Langue / Sprache">
  <option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option>
</select></div>

<section id="home" class="view">
  <h1>Hotel Bar</h1>
  <p class="sub" data-t="pick"></p>
  <button class="tile t-beer" data-open="beer"><h2 data-t="beerTitle"></h2><p data-t="beerSub"></p></button>
  <button class="tile t-cocktail" data-open="cocktail"><h2 data-t="ckTitle"></h2><p data-t="ckSub"></p></button>
</section>

<section id="beer" class="view hidden" style="--accent:var(--beer)">
  <button class="back" data-back data-t="back"></button>
  <div class="menu-head"><h2 data-t="beerTitle"></h2><p data-t="beerNote"></p></div>
  <div class="list" id="beerList"></div>
</section>

<section id="cocktail" class="view hidden" style="--accent:var(--cocktail)">
  <button class="back" data-back data-t="back"></button>
  <div class="menu-head"><h2 data-t="ckTitle"></h2><p data-t="ckNote"></p></div>
  <div class="list" id="cocktailList"></div>
</section>
</main>
<script>
var T={
en:{pick:"Pick a menu. Tap any item for details.",beerTitle:"On tap",beerSub:"5 beers, poured fresh",ckTitle:"Cocktails",ckSub:"5 house drinks",back:"Back to menus",
 beerNote:"Pint prices. Ask for a taster first.",ckNote:"Made to order. Ask for less sweet or stronger.",
 beer:[["Dry Irish Stout","Stout · 4.2%","€6.20","Roasted barley, dark chocolate, and a creamy finish. Our best seller."],
  ["Red Ale","Irish red · 4.5%","€6.40","Caramel malt with a gentle toasty bitterness. Easy to drink all night."],
  ["West Coast IPA","IPA · 6.2%","€7.00","Pine and grapefruit hops, dry and sharp."],
  ["Crisp Pilsner","Lager · 4.8%","€6.00","Clean, cold, and lightly floral."],
  ["Hazy Pale","Pale ale · 5.0%","€6.80","Juicy mango and peach, soft and cloudy."]],
 ck:[["Espresso Martini","Vodka, coffee liqueur, espresso","€11","Shaken hard for a thick foam. Topped with three coffee beans."],
  ["Old Fashioned","Irish whiskey, bitters, sugar","€12","Stirred slowly over a large ice cube with an orange twist."],
  ["Margarita","Tequila, lime, triple sec","€10.50","Salt rim on request. Classic and sharp."],
  ["Aperol Spritz","Aperol, prosecco, soda","€9.50","Light and bitter-sweet. Served long with an orange slice."],
  ["Dark &amp; Stormy","Dark rum, ginger beer, lime","€10","Spicy ginger over rum with a squeeze of fresh lime."]]},
fr:{pick:"Choisissez une carte. Touchez un article pour les détails.",beerTitle:"À la pression",beerSub:"5 bières, tirées à la minute",ckTitle:"Cocktails",ckSub:"5 créations de la maison",back:"Retour aux cartes",
 beerNote:"Prix à la pinte. Demandez une dégustation d’abord.",ckNote:"Préparés à la commande. Demandez-le moins sucré ou plus fort.",
 beer:[["Stout irlandaise sèche","Stout · 4,2 %","6,20 €","Orge torréfiée, chocolat noir et finale crémeuse. Notre meilleure vente."],
  ["Red Ale","Rousse irlandaise · 4,5 %","6,40 €","Malt caramel avec une légère amertume grillée. Facile à boire toute la soirée."],
  ["IPA côte ouest","IPA · 6,2 %","7,00 €","Houblons de pin et de pamplemousse, secs et vifs."],
  ["Pilsner croquante","Lager · 4,8 %","6,00 €","Nette, bien fraîche et légèrement florale."],
  ["Pale Ale trouble","Pale ale · 5,0 %","6,80 €","Mangue et pêche juteuses, douce et voilée."]],
 ck:[["Espresso Martini","Vodka, liqueur de café, expresso","11 €","Secoué fort pour une mousse épaisse. Servi avec trois grains de café."],
  ["Old Fashioned","Whiskey irlandais, bitter, sucre","12 €","Mélangé lentement sur un gros glaçon, avec un zeste d’orange."],
  ["Margarita","Tequila, citron vert, triple sec","10,50 €","Bord salé sur demande. Classique et vif."],
  ["Aperol Spritz","Aperol, prosecco, eau gazeuse","9,50 €","Léger et doux-amer. Servi long avec une tranche d’orange."],
  ["Dark &amp; Stormy","Rhum brun, ginger beer, citron vert","10 €","Gingembre épicé sur du rhum, avec un trait de citron vert frais."]]},
de:{pick:"Wählen Sie eine Karte. Tippen Sie auf ein Getränk für Details.",beerTitle:"Vom Fass",beerSub:"5 Biere, frisch gezapft",ckTitle:"Cocktails",ckSub:"5 Hausmischungen",back:"Zurück zu den Karten",
 beerNote:"Preise pro Pint. Fragen Sie zuerst nach einer Kostprobe.",ckNote:"Frisch gemixt. Auf Wunsch weniger süß oder stärker.",
 beer:[["Dry Irish Stout","Stout · 4,2 %","6,20 €","Geröstete Gerste, dunkle Schokolade und ein cremiger Abgang. Unser Bestseller."],
  ["Red Ale","Irish Red · 4,5 %","6,40 €","Karamellmalz mit leicht röstiger Bittere. Trinkt sich den ganzen Abend gut."],
  ["West Coast IPA","IPA · 6,2 %","7,00 €","Kiefer- und Grapefruithopfen, trocken und scharf."],
  ["Knackiges Pilsner","Lager · 4,8 %","6,00 €","Klar, kalt und leicht blumig."],
  ["Hazy Pale","Pale Ale · 5,0 %","6,80 €","Saftige Mango und Pfirsich, weich und trüb."]],
 ck:[["Espresso Martini","Wodka, Kaffeelikör, Espresso","11 €","Kräftig geschüttelt für dichten Schaum. Mit drei Kaffeebohnen."],
  ["Old Fashioned","Irischer Whiskey, Bitters, Zucker","12 €","Langsam über einem großen Eiswürfel gerührt, mit Orangenzeste."],
  ["Margarita","Tequila, Limette, Triple Sec","10,50 €","Salzrand auf Wunsch. Klassisch und scharf."],
  ["Aperol Spritz","Aperol, Prosecco, Soda","9,50 €","Leicht und bittersüß. Lang serviert mit einer Orangenscheibe."],
  ["Dark &amp; Stormy","Dunkler Rum, Ginger Beer, Limette","10 €","Würziger Ingwer über Rum mit einem Spritzer frischer Limette."]]}
};
function fill(id,rows){
  var list=document.getElementById(id);list.innerHTML='';
  rows.forEach(function(r){
    var d=document.createElement('div');d.className='item';
    d.innerHTML='<button aria-expanded="false"><span><span class="name">'+r[0]+'</span><span class="meta">'+r[1]+'</span></span><span class="price">'+r[2]+'</span></button><div class="more">'+r[3]+'</div>';
    d.querySelector('button').onclick=function(e){var o=d.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};
    list.appendChild(d);
  });
}
function setLang(l){
  var t=T[l];document.documentElement.lang=l;
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t[el.dataset.t]});
  fill('beerList',t.beer);fill('cocktailList',t.ck);
}
function show(id){
  document.querySelectorAll('.view').forEach(function(v){v.classList.add('hidden')});
  document.getElementById(id).classList.remove('hidden');window.scrollTo(0,0);
}
document.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){show(b.dataset.open)}});
document.querySelectorAll('[data-back]').forEach(function(b){b.onclick=function(){show('home')}});
var sel=document.getElementById('lang');
var start=(navigator.language||'en').slice(0,2);if(!T[start])start='en';
sel.value=start;setLang(start);
sel.onchange=function(){setLang(sel.value)};
</script>
</body>
</html>
